<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VF V6.87 FIX</title><style>*{box-sizing:border-box}body{font-family:Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:20px}h1{color:#38bdf8;font-size:20px;margin:0 0 6px}.fix{background:#052e16;border:1px solid #22c55e;border-radius:8px;padding:10px;color:#86efac;font-size:12px;margin-bottom:12px}.box{background:#1e293b;border:2px solid #22c55e;border-radius:12px;padding:14px;margin-bottom:14px}input,textarea{width:100%;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:10px}.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}button{background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:8px 14px;border-radius:8px;cursor:pointer}button.primary{background:#0284c7}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:12px}.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px}.card.ok{border-color:#22c55e}.card.err{border-color:#ef4444}.id{font-family:monospace;font-size:10px;color:#64748b;word-break:break-all}.badge{padding:3px 8px;border-radius:10px;font-size:11px}.green{background:#14532d;color:#86efac}.red{background:#7f1d1d;color:#fca5a5}</style></head><body><h1>🎙️ VF V6.87 FIX - 7 เสียง</h1><div class="fix">✅ แก้แล้ว: ยิงตรง ElevenLabs บน GitHub Pages ได้เลย - model eleven_v4</div><div class="box"><div class="row"><input id="k" type="password" placeholder="sk_..."><button onclick="document.getElementById('k').type=document.getElementById('k').type=='password'?'text':'password'">👁️</button></div><div class="row"><button class="primary" onclick="save()">💾 จำ Key</button><button onclick="clr()">🗑️ ลบ</button><button onclick="check()">🔑 ทดสอบ</button><span id="badge" class="badge red">ยังไม่ได้ใส่</span></div><div id="ks" style="font-size:11px;margin-top:8px;padding:6px;background:#0f172a;border-radius:6px;word-break:break-all">ยังไม่ได้ใส่ API Key</div></div><div class="row"><button class="primary" id="btn">🔊 ทดสอบทั้ง 7 เสียง (Direct)</button><button id="btnClr">🗑️ ล้าง</button></div><div style="margin-top:10px"><textarea id="txt">สวัสดีค่ะ ฉันชื่อกันยา ยินดีที่ได้รู้จักนะคะ วันนี้มาทดสอบเสียงภาษาไทยค่ะ</textarea></div><div id="stats"></div><div class="grid" id="grid"></div><script>const MODEL='eleven_v4',SETT={stability:0.70,similarity_boost:0.50,style:0.0,use_speaker_boost:true};const VOICES=[{id:'B4NdgwdU97lHqA8Udh2D',name:'กันยา'},{id:'deCz1h6mjB7HnY2xQz08',name:'เดชา'},{id:'mYcpTKg1oj1H5CtzUZNO',name:'มาลี'},{id:'MeUerI8vM5Ce2GSTXsRT',name:'อัพบีท'},{id:'FaUQoAqt8WX5mfvrvb3A',name:'ปรีชา'},{id:'RIc0VzgLsI8EhceUkZx4',name:'เนือง'},{id:'XLXcyPK1jTjw1pYLLcM9',name:'XLXcy'}];let mem=sessionStorage.getItem('EK')||'';const g=document.getElementById('grid'),s=document.getElementById('stats'),t=document.getElementById('txt');function ck(r){if(!r)return'';let c=r.trim();const m=c.match(/sk_[A-Za-z0-9]+/);if(m)c=m[0];return c.replace(/[^\x00-\x7F]/g,'').trim();}function getK(){return ck(document.getElementById('k').value||mem);}function ui(){const k=getK(),b=document.getElementById('badge'),ks=document.getElementById('ks');if(!k){b.textContent='ยังไม่ได้ใส่';b.className='badge red';ks.textContent='ยังไม่ได้ใส่';}else{b.textContent=`มีแล้ว ****${k.slice(-6)}`;b.className='badge green';ks.textContent=`✅ ****${k.slice(-6)} พร้อม ${MODEL}`;}}function save(){const c=ck(document.getElementById('k').value);if(!c||!c.startsWith('sk_')){alert('Key ไม่ถูก');return;}mem=c;sessionStorage.setItem('EK',c);ui();}function clr(){mem='';sessionStorage.removeItem('EK');document.getElementById('k').value='';ui();}async function check(){const k=getK();if(!k)return alert('ใส่ Key ก่อน');try{const r=await fetch('https://api.elevenlabs.io/v1/user',{headers:{'xi-api-key':k}});const j=await r.json();if(r.ok){document.getElementById('ks').textContent=`✅ Tier: ${j.subscription?.tier} ${j.subscription?.character_count}/${j.subscription?.character_limit}`;}else alert(JSON.stringify(j).slice(0,200));}catch(e){alert(e.message);}}function skel(){g.innerHTML='';VOICES.forEach(v=>{const d=document.createElement('div');d.className='card';d.id='card-'+v.id;d.innerHTML=`<h3 style="margin:0 0 4px;color:#38bdf8;font-size:14px">${v.name}</h3><div class="id">${v.id}</div><div class="status">รอทดสอบ</div>`;g.appendChild(d);});}async function one(v,text,key){const card=document.getElementById('card-'+v.id);try{const res=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${v.id}`,{method:'POST',headers:{'xi-api-key':key,'Content-Type':'application/json','Accept':'audio/mpeg'},body:JSON.stringify({text:text,model_id:MODEL,voice_settings:SETT})});if(!res.ok){const tt=await res.text();throw new Error(tt.slice(0,120));}const buf=await res.arrayBuffer();const url=URL.createObjectURL(new Blob([buf],{type:'audio/mpeg'}));card.classList.add('ok');card.querySelector('.status').textContent=`✅ ${(buf.byteLength/1024).toFixed(1)} KB`;const a=document.createElement('audio');a.controls=true;a.src=url;a.style.width='100%';card.appendChild(a);return {ok:true};}catch(e){card.classList.add('err');card.querySelector('.status').textContent=`❌ ${e.message}`;return {ok:false};}}async function testAll(){const key=getK();if(!key)return alert('ใส่ Key ก่อน');const btn=document.getElementById('btn');btn.disabled=true;s.innerHTML='';skel();let ok=0,ff=0;for(let i=0;i<VOICES.length;i+=2){const ch=VOICES.slice(i,i+2);const rs=await Promise.all(ch.map(v=>one(v,t.value||`สวัสดี ฉันชื่อ${v.name}`,key)));rs.forEach(r=>r.ok?ok++:ff++);s.innerHTML=`สำเร็จ ${ok}/7 ล้มเหลว ${ff}/7`;}btn.disabled=false;}document.getElementById('btn').onclick=testAll;document.getElementById('btnClr').onclick=()=>{g.innerHTML='';s.innerHTML='';skel();};document.getElementById('k').value=mem;ui();skel();</script></body></html>
