<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VF V7 FULL COMBINED FINAL - ไฟล์เดียวจบ - แก้โหลดไม่เข้า</title>
<style>*{box-sizing:border-box}body{margin:0;padding:12px;font-family:Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0}h1{color:#38bdf8;font-size:20px;margin:0 0 4px}.sub{color:#94a3b8;font-size:10px;margin-bottom:8px}.fix{background:#052e16;border:1px solid #22c55e;border-radius:8px;padding:8px;color:#86efac;font-size:11px;margin-bottom:10px}.box{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px;margin-bottom:10px}.box.green{border-color:#22c55e}input,textarea,select{width:100%;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:10px;font-size:13px}textarea.short{min-height:70px}textarea.long{min-height:200px}.row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}button{border:1px solid #334155;background:#1e293b;color:#e2e8f0;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12px}button.primary{background:#0284c7;border-color:#0ea5e9;color:#fff}button:disabled{opacity:.5}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{border-radius:20px;padding:9px 16px}.tabs button.active{background:#0284c7;color:#fff;border-color:#0ea5e9}.badge{padding:4px 10px;border-radius:10px;font-size:10px}.green{background:#14532d;color:#86efac}.red{background:#7f1d1d;color:#fca5a5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-top:8px}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px;cursor:pointer}.card.ok{border-color:#22c55e}.card.playing{border-color:#38bdf8;box-shadow:0 0 8px rgba(56,189,248,.3)}.card.err{border-color:#ef4444}.id{font-family:monospace;font-size:9px;color:#64748b;word-break:break-all}.story{background:#020617;border:2px solid #22c55e;border-radius:14px;padding:12px;margin-bottom:10px}.chunk{display:flex;gap:6px;align-items:center;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:11px}.chunk.playing{border-color:#38bdf8;background:#0c4a6e}.chunk.done{border-color:#22c55e}.dot{width:10px;height:10px;border-radius:50%;background:#334155;flex-shrink:0}.dot.playing{background:#38bdf8;animation:pulse 1s infinite}.dot.done{background:#22c55e}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}.progress{height:4px;background:#0f172a;border-radius:2px;margin-top:8px;overflow:hidden}.progress div{height:100%;background:#22c55e;width:0%;transition:width.3s}.hidden{display:none}.stat{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:6px 10px;font-size:11px;display:inline-block;margin:3px}</style>
</head>
<body>
<h1>🎙️ VF V7 FULL COMBINED FINAL - ไฟล์เดียวจบ</h1>
<div class="sub">eleven_v4 · 0.70/0.50 · Direct · 7 เสียง · ไม่ต้อง Backend · แก้โหลดไม่เข้าแล้ว</div>
<div class="fix">✅ รวมจบ: ทดสอบ 7 เสียง + เล่นทีละคน + เล่าเรื่องยาวต่อเนื่องจนจบ + โหลดเร็ว เสียงไม่ค้าง</div>
<div class="box green"><div class="row"><input id="apiKey" type="password" placeholder="sk_..."><button onclick="toggleEye()">👁️</button></div><div class="row"><button class="primary" onclick="saveKey()">💾 จำ</button><button onclick="clearKey()">🗑️ ลบ</button><button onclick="checkKey()">🔑 เช็ค</button><span id="badge" class="badge red">ยังไม่ได้ใส่</span></div><div id="keyInfo" style="font-size:11px;color:#94a3b8;margin-top:6px">ยังไม่ได้ใส่</div></div>
<div class="tabs"><button id="tabTest" class="active" onclick="switchTab('test')">🔊 ทดสอบ 7 เสียง</button><button id="tabStory" onclick="switchTab('story')">📖 เล่าเรื่องยาว</button></div>
<div id="panelTest"><div class="box"><textarea id="txtTest" class="short">สวัสดีค่ะ ฉันชื่อกันยา ยินดีที่ได้รู้จักนะคะ วันนี้มาทดสอบเสียงภาษาไทยค่ะ</textarea><div class="row"><button class="primary" id="btnTest7">🔊 ทดสอบ 7 เสียง</button><button id="btnSeq">▶️ เล่นทีละคน</button><button id="btnStop">⏹️ หยุด</button><button id="btnClear">🗑️ ล้าง</button></div></div><div id="stats"></div><div class="grid" id="grid"></div></div>
<div id="panelStory" class="hidden"><div class="box green"><div class="row"><select id="storyVoice" style="flex:1"></select><button class="primary" id="btnGen">📖 สร้างเสียง</button><button id="btnPlay">▶️ เล่นต่อเนื่อง</button><button id="btnStopStory">⏹️ หยุด</button></div><div class="row"><label style="font-size:11px">ชิ้นละ: <span id="chunkLabel">250</span> ตัว</label><input type="range" id="chunkSize" min="150" max="400" value="250" step="25" style="width:100%"></div></div><div class="box"><textarea id="txtStory" class="long">กาลครั้งหนึ่งนานมาแล้ว มีหญิงสาวชื่อกันยา อาศัยอยู่ในหมู่บ้านเล็กๆ

วันหนึ่ง มีข่าวลือว่าพระราชาจะเสด็จมาเยี่ยมหมู่บ้าน

และเมื่อวันนั้นมาถึง กันยาก็ได้เล่าเรื่องราวด้วยน้ำเสียงที่ไพเราะ ทุกคนในหมู่บ้านประทับใจมาก...</textarea><div style="font-size:10px;color:#64748b">ตัวอักษร: <span id="charCount">0</span> | ~<span id="chunkCount">0</span> ชิ้น</div></div><div id="storyBox" class="story hidden"><div style="display:flex;justify-content:space-between"><h3 style="margin:0;color:#22c55e;font-size:13px">🎧 <span id="storyName"></span> - <span id="storyProg">0/0</span></h3><span id="loadStatus" style="font-size:10px;color:#94a3b8"></span></div><audio id="storyAudio" controls preload="auto" style="width:100%;margin:8px 0"></audio><div class="row"><button class="primary" id="btnPrev">⏮️ ก่อนหน้า</button><button id="btnNext">⏭️ ถัดไป</button><button id="btnDownAll">⬇️ โหลดทั้งหมด</button></div><div class="progress"><div id="bar"></div></div><div id="chunks" style="margin-top:8px;max-height:300px;overflow-y:auto"></div></div></div>
<script>
const MODEL='eleven_v4',SETT={stability:0.70,similarity_boost:0.50,style:0.0,use_speaker_boost:true};
const VOICES=[{id:'B4NdgwdU97lHqA8Udh2D',name:'กันยา',g:'หญิง'},{id:'deCz1h6mjB7HnY2xQz08',name:'เดชา',g:'ชาย'},{id:'mYcpTKg1oj1H5CtzUZNO',name:'มาลี',g:'หญิง'},{id:'MeUerI8vM5Ce2GSTXsRT',name:'อัพบีท',g:'ชาย'},{id:'FaUQoAqt8WX5mfvrvb3A',name:'ปรีชา',g:'ชาย'},{id:'RIc0VzgLsI8EhceUkZx4',name:'เนือง',g:'หญิง'},{id:'XLXcyPK1jTjw1pYLLcM9',name:'XLXcy',g:'ชาย'}];
let mem=sessionStorage.getItem('EK')||'';const $=id=>document.getElementById(id);
function ck(r){if(!r)return'';let c=r.trim();const m=c.match(/sk_[A-Za-z0-9]+/);if(m)c=m[0];return c.replace(/[^\x00-\x7F]/g,'').trim();}
function getKey(){return ck($('apiKey').value||mem);}function ui(){const k=getKey(),b=$('badge'),i=$('keyInfo');if(!k){b.textContent='ยังไม่ได้ใส่';b.className='badge red';i.textContent='ยังไม่ได้ใส่';}else{b.textContent='****'+k.slice(-6);b.className='badge green';i.textContent='✅ ****'+k.slice(-6)+' พร้อม '+MODEL;}}
function toggleEye(){const e=$('apiKey');e.type=e.type==='password'?'text':'password';}
function saveKey(){const c=ck($('apiKey').value);if(!c||!c.startsWith('sk_')){alert('Key ไม่ถูก');return;}mem=c;sessionStorage.setItem('EK',c);ui();}
function clearKey(){mem='';sessionStorage.removeItem('EK');$('apiKey').value='';ui();}
async function checkKey(){const k=getKey();if(!k)return alert('ใส่ Key ก่อน');try{const r=await fetch('https://api.elevenlabs.io/v1/user',{headers:{'xi-api-key':k}});const j=await r.json();if(r.ok){$('keyInfo').textContent='✅ Tier:'+j.subscription?.tier+' '+j.subscription?.character_count+'/'+j.subscription?.character_limit;}else alert(JSON.stringify(j).slice(0,150));}catch(e){alert(e.message);}}
function switchTab(t){$('panelTest').classList.toggle('hidden',t!=='test');$('panelStory').classList.toggle('hidden',t!=='story');$('tabTest').classList.toggle('active',t==='test');$('tabStory').classList.toggle('active',t==='story');}
const grid=$('grid'),stats=$('stats'),txtTest=$('txtTest');let audios=[],cur=null,seq=false;
function skeleton(){grid.innerHTML='';audios=[];VOICES.forEach(v=>{const d=document.createElement('div');d.className='card';d.id='card-'+v.id;d.innerHTML='<h3>'+v.name+' <small style="color:#64748b">('+v.g+')</small></h3><div class="id">'+v.id+'</div><div class="status" style="font-size:11px">รอทดสอบ</div>';d.onclick=()=>playOne(v.id);grid.appendChild(d);});}
async function fetchTTS(id,text,key){const res=await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+id,{method:'POST',headers:{'xi-api-key':key,'Content-Type':'application/json','Accept':'audio/mpeg'},body:JSON.stringify({text:text,model_id:MODEL,voice_settings:SETT})});if(!res.ok){const t=await res.text();throw new Error(t.slice(0,120));}return await res.arrayBuffer();}
async function makeOne(v,text,key){const card=$('card-'+v.id);try{card.classList.add('playing');const buf=await fetchTTS(v.id,text,key);const url=URL.createObjectURL(new Blob([buf],{type:'audio/mpeg'}));card.classList.remove('playing');card.classList.add('ok');card.querySelector('.status').textContent='✅ '+(buf.byteLength/1024).toFixed(1)+' KB';let a=card.querySelector('audio');if(!a){a=document.createElement('audio');a.controls=true;a.preload='auto';a.style.width='100%';a.style.marginTop='6px';card.appendChild(a);}a.src=url;audios.push(a);return {ok:true,audio:a,url};}catch(e){card.classList.remove('playing');card.classList.add('err');card.querySelector('.status').textContent='❌ '+e.message;return {ok:false};}}
async function playOne(id){const k=getKey();if(!k)return alert('ใส่ Key ก่อน');const v=VOICES.find(x=>x.id===id);if(cur)cur.pause();const r=await makeOne(v,txtTest.value||'สวัสดี ฉันชื่อ'+v.name,k);if(r.ok){cur=r.audio;r.audio.play();}}
async function testAll(){const k=getKey();if(!k)return alert('ใส่ Key ก่อน');const btn=$('btnTest7');btn.disabled=true;stats.innerHTML='';skeleton();let ok=0,f=0;for(let i=0;i<VOICES.length;i++){const v=VOICES[i];const r=await makeOne(v,txtTest.value||'สวัสดี ฉันชื่อ'+v.name,k);r.ok?ok++:f++;stats.innerHTML='<div class="stat">สำเร็จ '+ok+'/7</div><div class="stat">ล้มเหลว '+f+'/7</div>';await new Promise(r=>setTimeout(r,600));}btn.disabled=false;}
async function playSeq(){const k=getKey();if(!k)return alert('ใส่ Key ก่อน');if(seq)return;seq=true;$('btnSeq').textContent='⏸️ เล่น...';for(const v of VOICES){if(!seq)break;const card=$('card-'+v.id);card.scrollIntoView({behavior:'smooth',block:'center'});let a=card.querySelector('audio');if(!a||!a.src){const r=await makeOne(v,txtTest.value||'สวัสดี ฉันชื่อ'+v.name,k);a=r.audio;}if(a){cur=a;await new Promise(res=>{a.onended=res;a.play().catch(()=>res());});}await new Promise(r=>setTimeout(r,500));}seq=false;$('btnSeq').textContent='▶️ เล่นทีละคน';}
function stopAll(){seq=false;audios.forEach(a=>{try{a.pause();}catch{}});if(cur)cur.pause();$('storyAudio').pause();}
$('btnTest7').onclick=testAll;$('btnSeq').onclick=playSeq;$('btnStop').onclick=stopAll;$('btnClear').onclick=()=>{grid.innerHTML='';stats.innerHTML='';skeleton();};
const storySel=$('storyVoice'),txtStory=$('txtStory'),chunkSize=$('chunkSize'),chunkLabel=$('chunkLabel'),charCount=$('charCount'),chunkCount=$('chunkCount');
VOICES.forEach(v=>{const o=document.createElement('option');o.value=v.id;o.textContent=v.name;storySel.appendChild(o);});
function upd(){const len=txtStory.value.length;charCount.textContent=len;const sz=parseInt(chunkSize.value);chunkCount.textContent=Math.ceil(len/sz)||0;chunkLabel.textContent=sz;}
txtStory.addEventListener('input',upd);chunkSize.addEventListener('input',upd);upd();
function splitText(text,size){const ch=[];let s=0;while(s<text.length){let e=Math.min(s+size,text.length);if(e<text.length){let cut=text.lastIndexOf('.',e);if(cut==-1)cut=text.lastIndexOf('\n',e);if(cut==-1)cut=text.lastIndexOf(' ',e);if(cut>s+size*0.6)e=cut+1;}ch.push(text.slice(s,e).trim());s=e;}return ch.filter(Boolean);}
let sChunks=[],sUrls=[],sIdx=0;const sBox=$('storyBox'),sAudio=$('storyAudio'),sName=$('storyName'),sProg=$('storyProg'),sBar=$('bar'),sDiv=$('chunks'),loadSt=$('loadStatus');
async function genStory(){const k=getKey();if(!k)return alert('ใส่ Key ก่อน');const text=txtStory.value.trim();if(!text)return alert('ใส่เรื่องก่อน');const vid=storySel.value;const v=VOICES.find(x=>x.id===vid);sName.textContent=v.name;sChunks=splitText(text,parseInt(chunkSize.value));sUrls=[];sDiv.innerHTML='';sBox.classList.remove('hidden');sProg.textContent='0/'+sChunks.length;sBar.style.width='0%';loadSt.textContent='กำลังสร้าง...';const btn=$('btnGen');btn.disabled=true;btn.textContent='⏳ สร้าง...';let ok=0;for(let i=0;i<sChunks.length;i++){const d=document.createElement('div');d.className='chunk';d.id='ch-'+i;d.innerHTML='<div class="dot"></div><div style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(i+1)+'. '+sChunks[i].slice(0,40)+'...</div>';sDiv.appendChild(d);try{d.querySelector('.dot').classList.add('playing');const buf=await fetchTTS(vid,sChunks[i],k);const url=URL.createObjectURL(new Blob([buf],{type:'audio/mpeg'}));sUrls[i]=url;ok++;d.querySelector('.dot').classList.remove('playing');d.querySelector('.dot').classList.add('done');d.classList.add('done');loadSt.textContent='สร้าง '+ok+'/'+sChunks.length;await new Promise(r=>setTimeout(r,800));}catch(e){d.querySelector('.dot').classList.remove('playing');d.style.borderColor='#ef4444';loadSt.textContent='Error ชิ้นที่ '+(i+1);await new Promise(r=>setTimeout(r,1000));}sProg.textContent=ok+'/'+sChunks.length;sBar.style.width=(ok/sChunks.length*100).toFixed(0)+'%';}btn.disabled=false;btn.textContent='📖 สร้างเสียง';loadSt.textContent='สร้างเสร็จ '+ok+'/'+sChunks.length+' พร้อมเล่น';if(sUrls[0])playIdx(0);}
function playIdx(i){if(i<0||i>=sUrls.length||!sUrls[i])return;sIdx=i;document.querySelectorAll('#chunks.chunk').forEach((el,idx)=>el.classList.toggle('playing',idx===i));sAudio.src=sUrls[i];sAudio.load();sAudio.play().catch(()=>{});sProg.textContent=(i+1)+'/'+sChunks.length+' กำลังเล่น';document.getElementById('ch-'+i)?.scrollIntoView({behavior:'smooth',block:'nearest'});}
sAudio.onended=()=>{const n=sIdx+1;if(n<sUrls.length&&sUrls[n])playIdx(n);else sProg.textContent=sChunks.length+'/'+sChunks.length+' จบแล้ว ✅';};
$('btnGen').onclick=genStory;$('btnPlay').onclick=()=>{if(sUrls.length===0)return alert('สร้างเสียงก่อน');playIdx(sIdx);};$('btnStopStory').onclick=()=>sAudio.pause();$('btnPrev').onclick=()=>playIdx(sIdx-1);$('btnNext').onclick=()=>playIdx(sIdx+1);$('btnDownAll').onclick=()=>{sUrls.forEach((u,i)=>{if(!u)return;const a=document.createElement('a');a.href=u;a.download='story-'+(i+1)+'.mp3';a.click();});};$('apiKey').value=mem;ui();skeleton();$('apiKey').addEventListener('input',ui);
</script></body></html>
